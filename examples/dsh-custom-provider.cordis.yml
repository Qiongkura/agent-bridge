# DeepSeek Harness — ACP config wired to a custom OpenAI-compatible provider.
#
# Why this file exists
# --------------------
# DSH's stock `examples/acp-agent/cordis.yml` hardcodes the official endpoint:
#
#     - id: llm-deepseek
#       config: { thinking: enabled, reasoningEffort: max, ... }
#     - id: acp-agent
#       config: { provider: deepseek-official, model: deepseek-v4-pro }
#
# That path requires a DEEPSEEK_API_KEY for a direct DeepSeek account. If you run
# DSH against a gateway, a proxy, or a third-party provider, the ACP server will
# start fine and then fail every turn with:
#
#     llm-deepseek: no API key for provider route "deepseek-official"
#
# This template swaps the model provider for `llm-pi-ai`, which speaks the plain
# OpenAI chat-completions protocol, so any compatible endpoint works.
#
# How to use
# ----------
# 1. Copy this file into your DSH checkout, e.g.
#      examples/acp-agent/cordis.local.yml
#    (Do not commit it: it carries your endpoint and key name.)
# 2. Replace the three placeholders below:
#      <YOUR_API_KEY_ENV>  — env var holding the key, e.g. MY_GATEWAY_KEY
#      <YOUR_BASE_URL>     — OpenAI-compatible base URL, ending in /v1
#      <YOUR_MODEL_ID>     — model id exactly as your endpoint expects it
# 3. Point the bridge at it:
#
#      {
#        "type": "acp",
#        "command": "node",
#        "args": ["--import", "tsx", "packages/examples/acp-demo/src/bin.ts",
#                 "--config", "examples/acp-agent/cordis.local.yml"],
#        "cwd": "G:/deepseek-harness",
#        "env": { "<YOUR_API_KEY_ENV>": "<the key>" },
#        "autoApprove": true
#      }
#
#    The `env` block matters: the ACP entry point only loads `.env` from its own
#    cwd and otherwise relies on the ambient environment. A key sitting in the
#    desktop app's credential store is NOT visible to it.
# 4. The model id is provider-specific. With routing proxies it often needs an
#    upstream prefix (`<alias>/<model>`); a bare model name fails at request time
#    even though session creation succeeds.

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      custom:
        apiKeyEnv: <YOUR_API_KEY_ENV>
        api: openai-completions
        baseURL: <YOUR_BASE_URL>
        compat:
          supportsStore: false
          supportsDeveloperRole: false
        models:
          - id: <YOUR_MODEL_ID>
            name: <YOUR_MODEL_ID>
            contextWindow: 128000
            maxTokens: 32768

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? (process.env.DSH_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')"
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? (process.env.DSH_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')) === 'danger-full-access' ? 'never' : 'ask'"

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: custom
    model: <YOUR_MODEL_ID>
    persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
